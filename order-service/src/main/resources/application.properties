spring.application.name=order-service

server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5434/order_db
spring.datasource.username=order_user
spring.datasource.password=order_password

spring.jpa.hibernate.ddl-auto=validate

clients.catalog.base-url=http://localhost:8081

spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=3s

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=app_user
spring.rabbitmq.password=app_password